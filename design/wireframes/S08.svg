 id="Navigation---My-progress"><rect x="30" y="295" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#657080"/><text x="62" y="308" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#222831">My progress</text></g><g id="Navigation---Resources"><rect x="30" y="353" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#657080"/><text x="62" y="366" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#222831">Resources</text></g><g id="Navigation---Connect"><rect x="30" y="411" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#657080"/><text x="62" y="424" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#222831">Connect</text></g><g id="Navigation---My-Rafiqi"><rect x="30" y="469" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#657080"/><text x="62" y="482" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#222831">My Rafiqi</text></g><g id="Page-heading"><text x="256" y="124" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#657080">S08 / STUDENT</text><text x="256" y="170" font-family="Nunito, Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#222831">Homework · Action &amp; Reaction</text><text x="256" y="201" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">Tailored practice · Due tomorrow.</text></g><g id="Page-tabs"><rect x="256" y="233" width="134.6" height="40" rx="8" fill="#F57436" stroke="#F57436"/><text x="270" y="257" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Explanation</text><rect x="398.6" y="233" width="100.19999999999999" height="40" rx="8" fill="#FFFFFF" stroke="#DDE1E5"/><text x="412.6" y="257" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#222831">Diagram</text><rect x="506.8" y="233" width="95" height="40" rx="8" fill="#FFFFFF" stroke="#DDE1E5"/><text x="520.8" y="257" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#222831">Chart</text></g><g id="Your-challenge"><rect x="256" y="299" width="716" height="207" rx="12" fill="#FFFFFF" stroke="#DDE1E5"/><text x="280" y="343" font-family="Nunito, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#222831">Your challenge</text><text x="280" y="384" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">A skater pushes a wall with a force of 200 N.</text><text x="280" y="422" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">Describe the force the wall exerts on the skater.</text><text x="280" y="460" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">Explain which body experiences each force.</text></g><g id="Hint-ladder"><rect x="996" y="299" width="412" height="324" rx="12" fill="#FFFFFF" stroke="#DDE1E5"/><text x="1020" y="343" font-family="Nunito, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#222831">Hint ladder</text><text x="1020" y="384" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">Hint 1: Identify the two interacting</text><text x="1020" y="407" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">bodies.</text><text x="1020" y="445" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">Hint 2: Compare magnitude and</text><text x="1020" y="468" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">direction.</text><text x="1020" y="506" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">Final hint: Separate the force pair</text><text x="1020" y="529" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">from net force.</text><rect x="1020" y="559" width="186.2" height="40" rx="8" fill="#F57436" stroke="#F57436"/><text x="1034" y="583" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Ask for next hint</text></g><g id="Your-answer"><rect x="256" y="530" width="716" height="286" rx="12" fill="#FFFFFF" stroke="#DDE1E5"/><text x="280" y="574" font-family="Nunito, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#222831">Your answer</text><text x="280" y="613" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#657080">Write your reasoning in your own words</text><rect x="280" y="623" width="668" height="104" rx="6" fill="#F7F7F5" stroke="#DDE1E5"/><rect x="280" y="752" width="169" height="40" rx="8" fill="#F57436" stroke="#F57436"/><text x="294" y="776" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Check my answer</text></g><g id="Feedback-states"><rect x="996" y="647" width="412" height="278" rx="12" fill="#FFFFFF" stroke="#DDE1E5"/><text x="1020" y="691" font-family="Nunito, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#222831">Feedback states</text><text x="1020" y="732" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">Empty answer: add your reasoning</text><text x="1020" y="770" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">Submitted: review Rafiqi’s feedback</text><text x="1020" y="808" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">Success: celebrate understanding and</text><text x="1020" y="831" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#657080">continue</text><rect x="1020" y="861" width="117.39999999999999" height="40" rx="8" fill="#F57436" stroke="#F57436"/><text x="1034" y="885" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Try again</text><rect x="1147.4" y="861" width="108.8" height="40" rx="8" fill="#FFFFFF" stroke="#DDE1E5"/><text x="1161.4" y="885" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#222831">Continue</text></g><g id="Handoff-label"><text x="256" y="975" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#657080">Rafiqi / S08 / Source: hw / Wireframe · example data</text></g><a xlink:href="S01.svg"><rect x="16" y="110" width="192" height="44" fill="#FFFFFF" fill-opacity="0"><title>Today</title></rect></a><a xlink:href="S02.svg"><rect x="16" y="168" width="192" height="44" fill="#FFFFFF" fill-opacity="0"><title>Learn</title></rect></a><a xlink:href="S08.svg"><rect x="16" y="226" width="192" height="44" fill="#FFFFFF" fill-opacity="0"><title>Homework</title></rect></a><a xlink:href="S12.svg"><rect x="16" y="284" width="192" height="44" fill="#FFFFFF" fill-opacity="0"><title>My progress</title></rect></a><a xlink:href="S10.svg"><rect x="16" y="342" width="192" height="44" fill="#FFFFFF" fill-opacity="0"><title>Resources</title></rect></a><a xlink:href="S09.svg"><rect x="16" y="400" width="192" height="44" fill="#FFFFFF" fill-opacity="0"><title>Connect</title></rect></a><a xlink:href="S11.svg"><rect x="16" y="458" width="192" height="44" fill="#FFFFFF" fill-opacity="0"><title>My Rafiqi</title></rect></a></svg>