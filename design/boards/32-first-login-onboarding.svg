<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><rect width="1600" height="1080" fill="#F8F7F3"/><text x="48" y="46" font-family="Nunito,Inter,sans-serif" font-size="31" font-weight="800" fill="#222831" text-anchor="start">Rafiqi · First-login onboarding screen</text><text x="48" y="76" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#697386" text-anchor="start">Provisional design · Student only · Opens once after successful login</text><rect x="48" y="110" width="730" height="860" rx="24" fill="#FFF" stroke="#E2E4E8" stroke-width="2"/><rect x="80" y="134" width="42" height="42" rx="13" fill="#F57436" stroke="#F57436" stroke-width="1"/><text x="101" y="162" font-family="Nunito,Inter,sans-serif" font-size="21" font-weight="800" fill="#FFF" text-anchor="middle">R</text><text x="136" y="162" font-family="Nunito,Inter,sans-serif" font-size="22" font-weight="800" fill="#F57436" text-anchor="start">Rafiqi</text><text x="746" y="161" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#697386" text-anchor="end">Skip for now</text><text x="413" y="214" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#697386" text-anchor="middle">Welcome · 0 of 3</text><rect x="293" y="230" width="240" height="6" rx="3" fill="#F8F7F3" stroke="#F8F7F3" stroke-width="1"/><rect x="293" y="230" width="48" height="6" rx="3" fill="#F57436" stroke="#F57436" stroke-width="1"/><g transform="translate(347 276) scale(1.35)"><circle cx="48" cy="48" r="44" fill="#FFF0E7"/><path d="M23 48C23 18 73 18 73 48v18c-10 14-40 14-50 0z" fill="#F57436"/><circle cx="39" cy="48" r="3"/><circle cx="57" cy="48" r="3"/><path d="M40 61q8 7 16 0" fill="none" stroke="#222831" stroke-width="3" stroke-linecap="round"/><path d="M27 26L20 10M69 26l7-16" stroke="#F57436" stroke-width="7" stroke-linecap="round"/></g><rect x="318" y="414" width="190" height="28" rx="14" fill="#F1EDFF" stroke="#F1EDFF" stroke-width="1"/><text x="413" y="433" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#6653B5" text-anchor="middle">A private 2-minute chat</text><text x="413" y="480" font-family="Nunito,Inter,sans-serif" font-size="34" font-weight="800" fill="#222831" text-anchor="middle">Welcome, Ahmed</text><text x="413" y="520" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#222831" text-anchor="middle">Meet Rafiqi, your learning companion.</text><text x="413" y="556" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#697386" text-anchor="middle">Answer three short questions so Rafiqi can adapt explanations</text><text x="413" y="580" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#697386" text-anchor="middle">to the way you learn. You choose what to share.</text><rect x="153" y="628" width="520" height="112" rx="16" fill="#F1EDFF" stroke="#F1EDFF" stroke-width="1"/><text x="183" y="661" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#6653B5" text-anchor="start">What happens next</text><text x="183" y="689" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#6653B5" text-anchor="start">1  Tell Rafiqi what you enjoy</text><text x="183" y="713" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#6653B5" text-anchor="start">2  Share what makes learning harder</text><text x="183" y="737" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#6653B5" text-anchor="start">3  Choose how you prefer explanations</text><rect x="223" y="782" width="380" height="48" rx="12" fill="#F57436" stroke="#F57436" stroke-width="1"/><text x="413" y="812" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Start the conversation</text><text x="413" y="862" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#697386" text-anchor="middle">Skip now and set this up later from My Rafiqi</text><text x="413" y="913" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#697386" text-anchor="middle">Your answers are not grades and do not affect your classes.</text><rect x="822" y="110" width="730" height="860" rx="24" fill="#FFF" stroke="#E2E4E8" stroke-width="2"/><rect x="854" y="134" width="42" height="42" rx="13" fill="#F57436" stroke="#F57436" stroke-width="1"/><text x="875" y="162" font-family="Nunito,Inter,sans-serif" font-size="21" font-weight="800" fill="#FFF" text-anchor="middle">R</text><text x="910" y="162" font-family="Nunito,Inter,sans-serif" font-size="22" font-weight="800" fill="#F57436" text-anchor="start">Rafiqi</text><text x="1520" y="161" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#697386" text-anchor="end">Skip for now</text><text x="1187" y="214" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#697386" text-anchor="middle">Question 1 of 3</text><rect x="1067" y="230" width="240" height="6" rx="3" fill="#F8F7F3" stroke="#F8F7F3" stroke-width="1"/><rect x="1067" y="230" width="96" height="6" rx="3" fill="#F57436" stroke="#F57436" stroke-width="1"/><text x="876" y="300" font-family="Nunito,Inter,sans-serif" font-size="28" font-weight="800" fill="#222831" text-anchor="start">Let’s start with what you enjoy</text><text x="876" y="332" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#697386" text-anchor="start">Rafiqi will use this to choose more relevant examples.</text><rect x="876" y="374" width="622" height="132" rx="18" fill="#F1EDFF" stroke="#F1EDFF" stroke-width="1"/><g transform="translate(894 391) scale(0.72)"><circle cx="48" cy="48" r="44" fill="#FFF0E7"/><path d="M23 48C23 18 73 18 73 48v18c-10 14-40 14-50 0z" fill="#F57436"/><circle cx="39" cy="48" r="3"/><circle cx="57" cy="48" r="3"/><path d="M40 61q8 7 16 0" fill="none" stroke="#222831" stroke-width="3" stroke-linecap="round"/><path d="M27 26L20 10M69 26l7-16" stroke="#F57436" stroke-width="7" stroke-linecap="round"/></g><text x="986" y="420" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#222831" text-anchor="start">What do you enjoy learning about</text><text x="986" y="446" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#222831" text-anchor="start">or doing outside class?</text><text x="876" y="548" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#697386" text-anchor="start">Choose an idea or write your own</text><rect x="876" y="570" width="194" height="28" rx="14" fill="#FFF" stroke="#FFF" stroke-width="1"/><text x="973" y="589" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#222831" text-anchor="middle">Real-life examples</text><rect x="1080" y="570" width="190" height="28" rx="14" fill="#FFF" stroke="#FFF" stroke-width="1"/><text x="1175" y="589" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#222831" text-anchor="middle">Drawing and making</text><rect x="1280" y="570" width="170" height="28" rx="14" fill="#FFF" stroke="#FFF" stroke-width="1"/><text x="1365" y="589" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#222831" text-anchor="middle">Tricky puzzles</text><rect x="876" y="630" width="622" height="116" rx="14" fill="#FFF" stroke="#E2E4E8" stroke-width="1"/><text x="896" y="662" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#697386" text-anchor="start">Tell Rafiqi in your own words…</text><text x="896" y="725" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#697386" text-anchor="start">0 / 300</text><rect x="1198" y="788" width="300" height="48" rx="12" fill="#F57436" stroke="#F57436" stroke-width="1"/><text x="1348" y="818" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Continue</text><rect x="876" y="788" width="300" height="48" rx="12" fill="#FFF" stroke="#E2E4E8" stroke-width="1"/><text x="1026" y="818" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#222831" text-anchor="middle">Back</text><text x="1187" y="876" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="500" fill="#697386" text-anchor="middle">You can edit or remove this answer later.</text><text x="48" y="1026" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#222831" text-anchor="start">Flow: Login success → first-login check → Welcome → 3 questions → Profile ready → Student Today</text><text x="48" y="1053" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="500" fill="#697386" text-anchor="start">Skip: Login success → Welcome → Skip → Today. Student can restart later from My Rafiqi.</text></svg>
