<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080"><rect width="900" height="1080" fill="#F8F7F3"/><text x="48" y="46" font-family="Nunito,Inter,sans-serif" font-size="30" font-weight="800" fill="#222831" text-anchor="start">First-login onboarding · Completion state</text><text x="48" y="76" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#697386" text-anchor="start">Provisional desktop continuation</text><rect x="85" y="110" width="730" height="860" rx="24" fill="#FFF" stroke="#E2E4E8" stroke-width="2"/><rect x="117" y="134" width="42" height="42" rx="13" fill="#F57436" stroke="#F57436" stroke-width="1"/><text x="138" y="162" font-family="Nunito,Inter,sans-serif" font-size="21" font-weight="800" fill="#FFF" text-anchor="middle">R</text><text x="173" y="162" font-family="Nunito,Inter,sans-serif" font-size="22" font-weight="800" fill="#F57436" text-anchor="start">Rafiqi</text><text x="783" y="161" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#697386" text-anchor="end">Skip for now</text><text x="450" y="214" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#697386" text-anchor="middle">Ready · 3 of 3</text><rect x="330" y="230" width="240" height="6" rx="3" fill="#F8F7F3" stroke="#F8F7F3" stroke-width="1"/><rect x="330" y="230" width="192" height="6" rx="3" fill="#F57436" stroke="#F57436" stroke-width="1"/><rect x="360" y="280" width="180" height="28" rx="14" fill="#E8F4EA" stroke="#E8F4EA" stroke-width="1"/><text x="450" y="299" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#36744B" text-anchor="middle">First profile ready</text><text x="450" y="341" font-family="Nunito,Inter,sans-serif" font-size="30" font-weight="800" fill="#222831" text-anchor="middle">You’re ready to learn with Rafiqi</text><text x="450" y="377" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#697386" text-anchor="middle">This is only a starting point. You stay in control.</text><rect x="147" y="420" width="606" height="244" rx="18" fill="#F8F7F3" stroke="#E2E4E8" stroke-width="1"/><text x="173" y="455" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#222831" text-anchor="start">How Rafiqi understands you</text><text x="173" y="483" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#697386" text-anchor="start">What you enjoy</text><text x="335" y="483" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#222831" text-anchor="start">Real-life examples and making things</text><rect x="603" y="464" width="120" height="28" rx="14" fill="#E8F4EA" stroke="#E8F4EA" stroke-width="1"/><text x="663" y="483" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#36744B" text-anchor="middle">Confident</text><text x="173" y="531" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#697386" text-anchor="start">Rather avoid</text><text x="335" y="531" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#222831" text-anchor="start">Long blocks of text</text><rect x="603" y="512" width="120" height="28" rx="14" fill="#F1EDFF" stroke="#F1EDFF" stroke-width="1"/><text x="663" y="531" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#6653B5" text-anchor="middle">Still forming</text><text x="173" y="579" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#697386" text-anchor="start">Learning style</text><text x="335" y="579" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#222831" text-anchor="start">Show an example, then let me try</text><rect x="603" y="560" width="120" height="28" rx="14" fill="#E8F4EA" stroke="#E8F4EA" stroke-width="1"/><text x="663" y="579" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#36744B" text-anchor="middle">Confident</text><text x="173" y="630" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#F57436" text-anchor="start">Not quite right? You can edit this anytime.</text><rect x="260" y="710" width="380" height="48" rx="12" fill="#F57436" stroke="#F57436" stroke-width="1"/><text x="450" y="740" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Go to Today</text><rect x="260" y="772" width="380" height="48" rx="12" fill="#FFF" stroke="#E2E4E8" stroke-width="1"/><text x="450" y="802" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#222831" text-anchor="middle">Review my answers</text><text x="450" y="864" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="500" fill="#697386" text-anchor="middle">Next time you log in, you’ll go straight to Today.</text><text x="48" y="1028" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#222831" text-anchor="start">Exit destination: Student Today</text></svg>